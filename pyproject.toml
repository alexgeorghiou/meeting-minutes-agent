[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "meeting-minutes-agent"
version = "0.1.0"
description = "Turn meeting recordings into structured minutes, decisions and action items with a LangGraph pipeline."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alex Georghiou", email = "alexcgrg@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "langgraph>=0.2.60",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
openai = ["langchain-openai>=0.2"]
local = ["faster-whisper>=1.0"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
minutes-agent = "minutes_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minutes_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["minutes_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
